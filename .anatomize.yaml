output: .anatomy
sources:
  - path: src
    output: src
    level: modules
  - path: tests
    output: tests
    level: hierarchy
formats:
  - json
exclude:
  - __pycache__
  - "*.pyc"
  - .git
  - .venv
  - .anatomy
  - .runtime
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - dist
  - build
  - "*.egg-info"
symlinks: forbid
workers: 0
pack:
  format: jsonl
  mode: hybrid
  output: .anatomy/repository.jsonl
  content:
    - src/anatomize/cli.py
    - src/anatomize/index/**
  max_output: 100_000t
  fit_to_max_output: true
