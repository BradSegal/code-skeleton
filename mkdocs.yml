site_name: Anatomize
site_description: Evidence-first repository review and lifecycle context for agents and humans
site_url: https://bradsegal.github.io/anatomize/
repo_url: https://github.com/BradSegal/anatomize
repo_name: BradSegal/anatomize
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Use light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start here:
      - Five-minute review: QUICKSTART.md
      - Lifecycle workflows: WORKFLOWS.md
  - Use Anatomize:
      - Interpret results: CONCEPTS.md
      - Choose an output: ARTIFACTS.md
      - Agent and automation integration: AUTOMATION.md
      - Import tool results: PROVIDERS.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Reference:
      - Public reference: REFERENCE.md
      - Generated capabilities: generated/capabilities.md
      - Generated Python API: generated/python-api.md
      - Generated schemas: generated/schemas.md
  - Contribute:
      - Maintainer guide: MAINTAINERS.md
  - Project:
      - Changelog: https://github.com/BradSegal/anatomize/blob/main/CHANGELOG.md
      - Contributing: https://github.com/BradSegal/anatomize/blob/main/CONTRIBUTING.md
      - Security: https://github.com/BradSegal/anatomize/security/policy

