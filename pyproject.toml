[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anatomize"
description = "Evidence-first repository review and lifecycle context for agents and humans"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [
    { name = "Bradley Max Segal", email = "bradleymaxsegal@gmail.com" }
]
keywords = ["code-review", "agent", "evidence", "static-analysis", "research-software", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "defusedxml>=0.7,<1",
    "pydantic>=2.0,<3",
    "typer>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "tomli>=2.0",
    "types-defusedxml>=0.7",
    "build",
    "twine",
    "check-wheel-contents",
    "mcp>=2,<3",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]
mcp = [
    "mcp>=2,<3",
]

[project.scripts]
anatomize = "anatomize.cli:app"

[project.urls]
Homepage = "https://bradsegal.github.io/anatomize/"
Documentation = "https://bradsegal.github.io/anatomize/"
Repository = "https://github.com/BradSegal/anatomize"

[tool.hatch.build.targets.wheel]
packages = ["src/anatomize"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/workflows",
    "/agents",
    "/docs",
    "/scripts",
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CITATION.cff",
    "/LICENSE",
    "/mkdocs.yml",
    "/README.md",
    "/SECURITY.md",
    "/SKILL.md",
    "/examples",
    "/pyproject.toml",
]

[tool.hatch.version]
path = "src/anatomize/version.py"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end CLI tests",
]
