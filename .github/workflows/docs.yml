name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/generate_documentation.py"
      - "scripts/verify_documentation_site.py"
      - "src/**"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/generate_documentation.py"
      - "scripts/verify_documentation_site.py"
      - "src/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9

      - name: Install the locked documentation environment
        run: uv sync --locked --extra docs

      - name: Verify generated public contracts
        run: uv run python scripts/generate_documentation.py --check

      - name: Build the strict site
        run: uv run mkdocs build --strict --site-dir site

      - name: Inspect the public site artifact
        run: uv run python scripts/verify_documentation_site.py --root . --site-dir site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
